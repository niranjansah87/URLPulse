# Local development infrastructure only.
# Application processes (web, api, worker) run on the host via pnpm for fast
# iteration (see docs/05-infrastructure/local-development.md). These credentials
# are local-development defaults, not production secrets.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlpulse
      POSTGRES_PASSWORD: urlpulse
      POSTGRES_DB: urlpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlpulse -d urlpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
