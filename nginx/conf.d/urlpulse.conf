# Host-installed Nginx. It reaches the app containers via their loopback-published
# ports (see docker-compose.prod.yml). Installed by scripts/deploy.sh to
# /etc/nginx/sites-available/urlpulse.conf and symlinked into sites-enabled.
upstream urlpulse_web { server 127.0.0.1:5173; }
upstream urlpulse_api { server 127.0.0.1:4000; }

# --- HTTP: ACME challenge + redirect everything else to HTTPS ---------------
server {
    listen 80;
    listen [::]:80;
    server_name urlpulse.niranjansah87.com.np;

    # Plain-HTTP liveness (served on :80 so an uptime check works before any TLS
    # cert exists). A matching /healthz is served on :443 below.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt HTTP-01 challenge (webroot shared with the certbot flow).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the public entrypoint -------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name urlpulse.niranjansah87.com.np;

    ssl_certificate     /etc/letsencrypt/live/urlpulse.niranjansah87.com.np/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urlpulse.niranjansah87.com.np/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    # CSV upload ceiling. The API accepts multipart files up to 5MB
    # (@fastify/multipart) and JSON bodies up to 4MB; 6m leaves a small margin.
    client_max_body_size 6m;

    # Security headers. HSTS is safe once HTTPS is confirmed working. No CSP is
    # set here: it would need per-app tuning and can silently break the SPA.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # nginx's own liveness endpoint (served directly, no upstream dependency).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API + Better Auth + SSE. Same origin as the frontend, so the browser sends
    # the session cookie with no CORS preflight and CSRF's Origin check passes.
    location /api/ {
        proxy_pass http://urlpulse_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/batches/:id/events): stream events without buffering and hold
        # the long-lived connection open. The API also sends X-Accel-Buffering:no.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Everything else is the Next.js app.
    location / {
        proxy_pass http://urlpulse_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev/HMR uses websockets; harmless in prod and future-proof.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
